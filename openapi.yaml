        "200":
          description: Aggregate send result (per-recipient failures are reported here, not as an error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMailResult'
        "400":
          description: Missing subject/html, no recipients resolved, or too many recipients
        "401":
          description: Not authenticated
        "403":
          description: Authenticated but not an admin
