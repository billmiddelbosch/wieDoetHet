openapi: "3.0.1"

info:
  title: wieDoetHet API
  description: >
    Backend API for the wieDoetHet task-assignment platform.
    Authentication is handled inside each Lambda function via Bearer JWT.
    Anonymous users (share-link access) do not need a token.
  version: "1.0"

servers:
  - url: https://trca8esu3j.execute-api.eu-west-2.amazonaws.com/production
    description: Production

components:
  schemas:

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        avatarUrl:
          type: string
        mailOptOut:
          type: boolean
          description: True when an admin recorded that this user opted out of e-mail.
        lastSeenAt:
          type: string
          description: Last login/dashboard visit (throttled to one write per 24h).
      required:
        - id
        - name
        - email

    Group:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        pictureUrl:
          type: string
        shareToken:
          type: string
        initiatorId:
          type: string
        requireTaskSelection:
          type: boolean
        scorecardVisibility:
          type: string
          enum:
            - all
            - selected
            - initiator
        scorecardViewerIds:
          type: array
          items:
            type: string
        reminderAt:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - shareToken
        - initiatorId
        - requireTaskSelection
        - scorecardVisibility
        - createdAt

    GroupInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        pictureUrl:
          type: string
        requireTaskSelection:
          type: boolean
        scorecardVisibility:
          type: string
          enum:
            - all
            - selected
            - initiator
        scorecardViewerIds:
          type: array
          items:
            type: string
        reminderAt:
          type: string
      required:
        - name

    Task:
      type: object
      properties:
        id:
          type: string
        groupId:
          type: string
        title:
          type: string
        description:
          type: string
        maxClaims:
          type: integer
          minimum: 1
        order:
          type: integer
      required:
        - id
        - groupId
        - title
        - maxClaims
        - order

    TaskInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        maxClaims:
          type: integer
          minimum: 1
      required:
        - title

    Claim:
      type: object
      properties:
        id:
          type: string
        groupId:
          type: string
        taskId:
          type: string
        userId:
          type: string
        anonymousName:
          type: string
        sessionId:
          type: string
        claimedAt:
          type: string
      required:
        - id
        - groupId
        - taskId
        - claimedAt

    ScorecardEntry:
      type: object
      properties:
        id:
          type: string
        groupId:
          type: string
        taskId:
          type: string
        userId:
          type: string
        anonymousName:
          type: string
        sessionId:
          type: string
        claimedAt:
          type: string
        taskTitle:
          type: string
        claimedByName:
          type: string
      required:
        - id
        - groupId
        - taskId
        - claimedAt
        - taskTitle
        - claimedByName

    ClaimInput:
      type: object
      properties:
        anonymousName:
          type: string
          minLength: 1
          maxLength: 100
        sessionId:
          type: string
          minLength: 1
          maxLength: 128

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
        - token
        - user

    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    AdminUserSummary:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
            - admin
            - user
        createdAt:
          type: string
        groupCount:
          type: integer
        lastActivityAt:
          type: string
        mailOptOut:
          type: boolean
      required:
        - id
        - email
        - name
        - role
        - createdAt
        - groupCount
        - lastActivityAt
        - mailOptOut

    AdminUserDetail:
      allOf:
        - $ref: '#/components/schemas/AdminUserSummary'
        - type: object
          properties:
            mailOptOutAt:
              type: string
              nullable: true
            lastSeenAt:
              type: string
              nullable: true
            groups:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  shareToken:
                    type: string
                  createdAt:
                    type: string
                required:
                  - id
                  - name
                  - shareToken
                  - createdAt
          required:
            - groups

    AdminUserListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserSummary'
        nextCursor:
          type: string
          nullable: true
        totalCount:
          type: integer
          description: >-
            Total users matching q (or all users, if q is absent) — not just
            this page. Powers the "select all N matching filter" affordance
            in the admin UI.
      required:
        - items
        - nextCursor
        - totalCount

    AdminGroupSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        pictureUrl:
          type: string
          nullable: true
        initiatorId:
          type: string
        initiatorName:
          type: string
        initiatorEmail:
          type: string
        taskCount:
          type: integer
        memberCount:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - name
        - initiatorId
        - initiatorName
        - initiatorEmail
        - taskCount
        - memberCount
        - createdAt

    AdminGroupDetail:
      allOf:
        - $ref: '#/components/schemas/AdminGroupSummary'
        - type: object
          properties:
            tasks:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  order:
                    type: integer
                  claimCount:
                    type: integer
                required:
                  - id
                  - title
                  - order
                  - claimCount
          required:
            - tasks

    AdminGroupListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminGroupSummary'
        nextCursor:
          type: string
          nullable: true
      required:
        - items
        - nextCursor

    AdminStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalGroups:
          type: integer
        newUsersLast7d:
          type: integer
        newGroupsLast7d:
          type: integer
        recentUsers:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserSummary'
        recentGroups:
          type: array
          items:
            $ref: '#/components/schemas/AdminGroupSummary'
        generatedAt:
          type: string
      required:
        - totalUsers
        - totalGroups
        - newUsersLast7d
        - newGroupsLast7d
        - recentUsers
        - recentGroups
        - generatedAt

    AdminMailRequest:
      type: object
      description: >-
        Either userIds or selectAll must be provided. When selectAll is true,
        the server re-resolves every user matching q itself — a client-
        supplied userIds list is never trusted for the "select all" case.
      properties:
        userIds:
          type: array
          items:
            type: string
          description: Explicit recipient user IDs. Ignored if selectAll is true.
        selectAll:
          type: boolean
          description: If true, send to every user matching q (re-resolved server-side).
        q:
          type: string
          description: Same search filter as GET /admin/users' q. Only used when selectAll is true.
        subject:
          type: string
        html:
          type: string
          description: HTML email body.
      required:
        - subject
        - html

    AdminMailResult:
      type: object
      properties:
        sent:
          type: integer
        failed:
          type: integer
        skippedOptOut:
          type: integer
          description: Recipients skipped because the user opted out of e-mail.
        failures:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
              email:
                type: string
              message:
                type: string
            required:
              - userId
              - email
              - message
      required:
        - sent
        - failed
        - failures
        - skippedOptOut

    MailTemplate:
      type: object
      description: >-
        A lifecycle mail template: the code definition (trigger, allowed
        placeholders, default text) merged with the admin's stored
        configuration. A template without stored configuration is disabled
        and uses the default text.
      properties:
        id:
          type: string
          enum:
            - welcome
            - no_group
            - no_tasks
            - no_claims
            - day_after_event
            - dormant_30
            - dormant_60
        scope:
          type: string
          enum:
            - user
            - group
          description: One mail per user, or one per group.
        tier:
          type: string
          enum:
            - immediate
            - timely
            - normal
          description: >-
            immediate = any hour on any day (a few minutes after the trigger),
            timely = Monday-Friday 10:00, normal = Tuesday-Thursday 10:00
            (Europe/Amsterdam).
        enabled:
          type: boolean
        subject:
          type: string
          description: Effective subject (override, else the default).
        bodyHtml:
          type: string
          description: Effective body (override, else the default).
        defaultSubject:
          type: string
        defaultBodyHtml:
          type: string
        isCustomised:
          type: boolean
          description: True when an override of the subject and/or body is stored.
        variables:
          type: array
          items:
            type: string
          description: Placeholders (without braces) this template may use, e.g. firstName.
        updatedAt:
          type: string
          nullable: true
        updatedBy:
          type: string
          nullable: true
          description: Id of the admin who last changed the configuration.
      required:
        - id
        - scope
        - tier
        - enabled
        - subject
        - bodyHtml
        - defaultSubject
        - defaultBodyHtml
        - isCustomised
        - variables
        - updatedAt
        - updatedBy

    MailLastRun:
      type: object
      description: The most recent run of the lifecycle function (dry runs included).
      properties:
        at:
          type: string
        masterEnabled:
          type: boolean
          description: >-
            The lifecycle function was allowed to send at run time: the master
            switch (see MailMaster) was on and the emergency stop was not set.
        killSwitch:
          type: boolean
          description: >-
            LIFECYCLE_MAIL_ENABLED was "false" on the Lambda, which forces
            masterEnabled off whatever the master switch says.
        dryRun:
          type: boolean
        evaluated:
          type: integer
        sent:
          type: integer
        failed:
          type: integer
        skippedByCap:
          type: integer
          description: Due mails over LIFECYCLE_MAX_SENDS_PER_RUN; they wait for the next run.
      required:
        - at
        - masterEnabled
        - killSwitch
        - dryRun
        - evaluated
        - sent
        - failed
        - skippedByCap

    MailMaster:
      type: object
      description: >-
        The lifecycle-mail master switch of this environment's table. Absent
        in the table counts as off, so nothing is sent until an admin turns it
        on.
      properties:
        enabled:
          type: boolean
        updatedAt:
          type: string
          nullable: true
          description: null when the switch was never set.
        updatedBy:
          type: string
          nullable: true
          description: User id of the admin who last changed it; null when never set.
      required:
        - enabled
        - updatedAt
        - updatedBy

    MailMasterPatch:
      type: object
      properties:
        enabled:
          type: boolean
      required:
        - enabled

    MailTemplateListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MailTemplate'
        lastRun:
          allOf:
            - $ref: '#/components/schemas/MailLastRun'
          nullable: true
          description: null when the lifecycle function has never run.
        master:
          $ref: '#/components/schemas/MailMaster'
      required:
        - items
        - lastRun
        - master

    MailTemplatePatch:
      type: object
      description: >-
        Partial update; at least one field is required. A null subject or
        bodyHtml removes the override and returns to the default text.
        Placeholders the template does not allow are rejected with a 400.
      properties:
        enabled:
          type: boolean
        subject:
          type: string
          nullable: true
        bodyHtml:
          type: string
          nullable: true

    MailLogEntry:
      type: object
      description: One attempted lifecycle mail. The rendered body is not stored.
      properties:
        id:
          type: string
          description: templateId:userId:scopeId
        templateId:
          type: string
        userId:
          type: string
        email:
          type: string
          description: Snapshot at send time.
        userName:
          type: string
          description: Snapshot at send time.
        groupId:
          type: string
          nullable: true
        groupName:
          type: string
          nullable: true
        subject:
          type: string
          description: The rendered subject that was sent.
        status:
          type: string
          enum:
            - sending
            - sent
            - failed
        attempts:
          type: integer
        errorMessage:
          type: string
          nullable: true
        sesMessageId:
          type: string
          nullable: true
        createdAt:
          type: string
        sentAt:
          type: string
          nullable: true
      required:
        - id
        - templateId
        - userId
        - email
        - status
        - createdAt

    MailLogListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MailLogEntry'
        nextCursor:
          type: string
          nullable: true
      required:
        - items
        - nextCursor

    MailOptOutRequest:
      type: object
      properties:
        optOut:
          type: boolean
      required:
        - optOut

    MailOptOutResponse:
      type: object
      properties:
        id:
          type: string
        mailOptOut:
          type: boolean
        mailOptOutAt:
          type: string
          nullable: true
      required:
        - id
        - mailOptOut
        - mailOptOutAt

paths:

  /auth/login:
    post:
      summary: Log in with email and password
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        "200":
          description: Login successful
        "401":
          description: Invalid credentials
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "arn:aws:apigateway:eu-west-2:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-west-2:344050431068:function:wiedoethet-auth/invocations"
        passthroughBehavior: when_no_match

  /auth/register:
    post:
      summary: Create a new account
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                  minLength: 8
              required:
                - name
                - email
                - password
      responses:
        "201":
          description: Account created
        "409":
          description: Email already in use
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "arn:aws:apigateway:eu-west-2:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-west-2:344050431068:function:wiedoethet-auth/invocations"
        passthroughBehavior: when_no_match

  /auth/me:
    get:
      summary: Get the currently authenticated user
      operationId: getMe
      responses:
        "200":
          description: Current user
        "401":
          description: Not authenticated
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "arn:aws:apigateway:eu-west-2:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-west-2:344050431068:function:wiedoethet-auth/invocations"
        passthroughBehavior: when_no_match

  /groups:
    get:
      summary: List groups where the authenticated user is initiator
      operationId: listGroups
      responses:
        "200":
          description: Array of groups
        "401":
          description: Not authenticated
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "arn:aws:apigateway:eu-west-2:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-west-2:344050431068:function:wiedoethet-groups/invocations"
        passthroughBehavior: when_no_match

    post:
      summary: Create a new group
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupInput'
      responses:
        "201":
          description: Group created
        "401":
          description: Not authenticated
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "arn:aws:apigateway:eu-west-2:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-west-2:344050431068:function:wiedoethet-groups/invocations"
        passthroughBehavior: when_no_match

  /groups/share/{shareToken}:
    get:
      summary: Resolve a public share token to a group
      operationId: getGroupByShareToken
      parameters:
        - name: shareToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group details
        "404":
          description: Group not found
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "arn:aws:apigateway:eu-west-2:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-west-2:344050431068:function:wiedoethet-groups/invocations"
        passthroughBehavior: when_no_match

  /groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string

    get:
      summary: Get a single group by ID
      operationId: getGroup
      responses:
        "200":
          description: Group details
        "401":
          description: Not authenticated
        "403":
          description: Not the initiator
        "404":
          description: Group not found
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "arn:aws:apigateway:eu-west-2:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-west-2:344050431068:function:wiedoethet-groups/invocations"
        passthroughBehavior: when_no_match

    patch:
      summary: Update group settings
      operationId: updateGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupInput'
      responses:
        "200":
          description: Updated group
        "401":
          description: Not authenticated
        "403":
          description: Not the initiator
        "404":
          description: Group not found
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "arn:aws:apigateway:eu-west-2:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-west-2:344050431068:function:wiedoethet-groups/invocations"
        passthroughBehavior: when_no_match

    delete:
      summary: Delete a group
      operationId: deleteGroup
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated
        "403":
          description: Not the initiator
        "404":
          description: Group not found
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "arn:aws:apigateway:eu-west-2:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-west-2:344050431068:function:wiedoethet-groups/invocations"
        passthroughBehavior: when_no_match

  /groups/{groupId}/tasks:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string

    get:
      summary: List all tasks in a group
      operationId: listTasks
      responses:
        "200":
          description: Array of tasks
        "404":
          description: Group not found
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "arn:aws:apigateway:eu-west-2:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-west-2:344050431068:function:wiedoethet-tasks/invocations"
        passthroughBehavior: when_no_match

    post:
      summary: Create a new task in a group
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        "201":
          description: Task created
        "401":
          description: Not authenticated
        "403":
          description: Not the initiator
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "arn:aws:apigateway:eu-west-2:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-west-2:344050431068:function:wiedoethet-tasks/invocations"
        passthroughBehavior: when_no_match

  /groups/{groupId}/tasks/{taskId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      - name: taskId
        in: path
        required: true
        schema:
          type: string

    patch:
      summary: Update a task
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        "200":
          description: Updated task
        "401":
          description: Not authenticated
        "403":
          description: Not the initiator
        "404":
          description: Task not found
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "arn:aws:apigateway:eu-west-2:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-west-2:344050431068:function:wiedoethet-tasks/invocations"
        passthroughBehavior: when_no_match

    delete:
      summary: Delete a task
      operationId: deleteTask
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated
        "403":
          description: Not the initiator
        "404":
          description: Task not found
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "arn:aws:apigateway:eu-west-2:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-west-2:344050431068:function:wiedoethet-tasks/invocations"
        passthroughBehavior: when_no_match

  /groups/{groupId}/tasks/{taskId}/claim:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      - name: taskId
        in: path
        required: true
        schema:
          type: string

    post:
      summary: Claim a task
      operationId: claimTask
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimInput'
      responses:
        "201":
          description: Task claimed
        "404":
          description: Task not found
        "409":
          description: Task is already at full capacity
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "arn:aws:apigateway:eu-west-2:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-west-2:344050431068:function:wiedoethet-claims/invocations"
        passthroughBehavior: when_no_match

    delete:
      summary: Unclaim a task
      operationId: unclaimTask
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
      responses:
        "204":
          description: Claim removed
        "404":
          description: Claim not found
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
